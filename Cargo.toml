[workspace]
resolver = "3"
members = ["crates/engine", "crates/rtd", "crates/amsi", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Ottimizzazioni release (devono stare nel Cargo.toml radice del workspace).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
