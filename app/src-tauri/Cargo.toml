[package]
name = "vigil"
description = "Vigil Antivirus"
authors = ["Lorenzo Montorsi"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Il suffisso `_lib` evita il conflitto di nomi tra lib e bin su Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "vigil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vigil-engine = { path = "../../crates/engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
