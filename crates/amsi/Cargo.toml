[package]
name = "vigil-amsi"
description = "Vigil: provider AMSI (scansione degli script prima dell'esecuzione)"
version.workspace = true
edition.workspace = true
license.workspace = true

# DLL COM caricata da Windows dentro ogni processo che usa AMSI (PowerShell,
# Windows Script Host, macro di Office…). Volutamente leggera: niente motore,
# il contenuto viene analizzato dal servizio VigilRtd.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Antimalware", "Win32_System_Com", "Win32_Foundation"] }
windows-core = "0.62"
